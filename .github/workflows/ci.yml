name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: football
          POSTGRES_PASSWORD: football
          POSTGRES_DB: football_content_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U football -d football_content_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://football:football@localhost:5432/football_content_test
      TEST_REDIS_URL: redis://localhost:6379/1
      API_FOOTBALL_BASE_URL: https://v3.football.api-sports.io
      API_FOOTBALL_KEY: test-not-used
      CURSOR_SIGNING_SECRET: ci-test-secret-with-at-least-thirty-two-characters
      RUN_INTEGRATION_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm verify:runtime
      - run: pnpm test:workers
