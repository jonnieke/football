services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
      POSTGRES_DB: football_content
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football_content"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: pnpm --filter @fcp/api start
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  football-ingestion:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: pnpm --filter @fcp/football-ingestion start
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  event-processor:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: pnpm --filter @fcp/event-processor start
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  content-generator:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: pnpm --filter @fcp/content-generator start
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  outbox-dispatcher:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: pnpm --filter @fcp/outbox-dispatcher start
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
